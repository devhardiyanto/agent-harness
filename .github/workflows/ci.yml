name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-repo.mjs
      - name: npm test
        run: |
          set +e
          npm test > test.log 2>&1
          code=$?
          cat test.log
          if [ $code -ne 0 ]; then
            msg=$(grep -E -B1 -A12 "^\s*not ok" test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=npm test gagal::${msg}"
          fi
          exit $code
